# pytest configuration for this plugin's suites (tests/).
#
# The cache provider is disabled on purpose: this repository's markdownlint task lints
# `**/*.md` without consulting .gitignore, so a generated `.pytest_cache/README.md`
# inside the plugin makes the repo-wide `mise run lint:md` fail. No cache, no artifact.
[pytest]
testpaths = tests
addopts = -p no:cacheprovider
